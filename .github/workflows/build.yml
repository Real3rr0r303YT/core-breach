name: CORE//BREACH APK Builder

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Validate levels (unit tests)
        run: ./gradlew --no-daemon core:test

      - name: Decode release keystore (optional)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo ">> release keystore loaded"
          else
            echo ">> no KEYSTORE_B64 secret: APK wird mit Debug-Key signiert"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: ./gradlew --no-daemon --stacktrace android:assembleRelease

      - name: Collect + verify APK
        id: apk
        run: |
          set -euo pipefail
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VERSION="$GITHUB_REF_NAME"; else VERSION="build-${GITHUB_RUN_NUMBER}"; fi
          SRC=$(find android/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [[ -z "$SRC" ]]; then echo "::error::Keine APK gefunden"; exit 1; fi
          # Ohne libgdx.so / libgdx-box2d.so crasht das Spiel sofort beim Start
          for lib in libgdx.so libgdx-box2d.so; do
            unzip -l "$SRC" | grep -q "arm64-v8a/$lib" || { echo "::error::$lib fehlt in der APK"; exit 1; }
          done
          cp "$SRC" "dist/CORE-BREACH-${VERSION}.apk"
          echo "file=dist/CORE-BREACH-${VERSION}.apk" >> "$GITHUB_OUTPUT"
          ls -lh dist/

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: CORE-BREACH-apk
          path: dist/*.apk
          retention-days: 30

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.apk.outputs.file }}
          generate_release_notes: true
